name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Ensure CocoaPods
        run: command -v pod >/dev/null || brew install cocoapods

      - name: Build 真果鉴
        run: python3 scripts/build_ios.py --all-sources

      - name: Check 真果鉴 IPA
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(dist/ios/zhenguojian-*-ios-unsigned.ipa)
          red=(dist/ios/hongguojian-*.ipa)
          if [ "${#ipas[@]}" -ne 1 ] || [ "${#red[@]}" -ne 0 ]; then
            echo "需要且只能有一个真果鉴 IPA"
            ls -la dist/ios || true
            exit 1
          fi
          tmp=$(mktemp -d)
          unzip -q "${ipas[0]}" "Payload/Runner.app/Info.plist" -d "$tmp"
          name=$(plutil -extract CFBundleDisplayName raw -o - "$tmp/Payload/Runner.app/Info.plist")
          echo "CFBundleDisplayName=$name"
          test "$name" = "真果鉴"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="v${version}"
          ipa=(dist/ios/zhenguojian-*-ios-unsigned.ipa)
          notes=$(mktemp)
          printf '真果鉴 %s\n\n未签名 IPA，使用 --all-sources 构建，不包含红果鉴。\n' "$version" > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${ipa[0]}" --clobber
            gh release edit "$tag" --title "真果鉴 ${version}" --notes-file "$notes"
          else
            gh release create "$tag" "${ipa[0]}" --title "真果鉴 ${version}" --notes-file "$notes"
          fi
